name: Build Watch Face

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  SDK_VERSION: "7.1.1"
  DEVICE: "fr255"

jobs:
  build:
    name: Compile Monkey C
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── SDK Connect IQ ────────────────────────────────────────────────────
      - name: Cache SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ~/ciq-sdk
          key: ciq-sdk-${{ env.SDK_VERSION }}

      - name: Download SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          wget -q "https://developer.garmin.com/downloads/connect-iq/sdks/connectiq-sdk-lin-${{ env.SDK_VERSION }}-2024-01-23-306c27a98.zip" \
            -O /tmp/ciq-sdk.zip
          mkdir -p ~/ciq-sdk
          unzip -q /tmp/ciq-sdk.zip -d ~/ciq-sdk

      - name: Add SDK to PATH
        run: echo "$HOME/ciq-sdk/bin" >> $GITHUB_PATH

      # ── Clé développeur ───────────────────────────────────────────────────
      - name: Setup developer key
        env:
          DEVELOPER_KEY: ${{ secrets.GARMIN_DEVELOPER_KEY }}
        run: |
          if [ -n "$DEVELOPER_KEY" ]; then
            echo "$DEVELOPER_KEY" | base64 --decode > /tmp/developer_key.der
          else
            # Génère une clé temporaire pour valider la compilation
            openssl genrsa -out /tmp/dev.pem 4096 2>/dev/null
            openssl pkcs8 -topk8 -inform PEM -outform DER \
              -in /tmp/dev.pem -out /tmp/developer_key.der -nocrypt
            echo "::warning::Clé temporaire utilisée. Ajoutez GARMIN_DEVELOPER_KEY dans les secrets GitHub."
          fi

      # ── Compilation ───────────────────────────────────────────────────────
      - name: Build watch face
        run: |
          mkdir -p bin
          monkeyc \
            -o bin/GarminSwatch.prg \
            -f monkey.jungle \
            -y /tmp/developer_key.der \
            -d ${{ env.DEVICE }} \
            --warn

      # ── Artifact ──────────────────────────────────────────────────────────
      - name: Upload PRG
        uses: actions/upload-artifact@v4
        with:
          name: GarminSwatch-${{ env.DEVICE }}-${{ github.sha }}
          path: bin/GarminSwatch.prg
          retention-days: 30

  # ── Release automatique sur tag v* ────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: GarminSwatch-${{ env.DEVICE }}-${{ github.sha }}
          path: bin/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/GarminSwatch.prg
          generate_release_notes: true
