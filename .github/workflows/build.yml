name: Build Watch Face

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Compile — ${{ matrix.device }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        device: [fr255, fr255m]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── connect-iq-sdk-manager-cli ────────────────────────────────────────
      - name: Install connect-iq-sdk-manager
        run: |
          VERSION=$(curl -sf https://api.github.com/repos/lindell/connect-iq-sdk-manager-cli/releases/latest \
            | jq -r '.tag_name' | sed 's/v//')
          curl -fsSL -L \
            "https://github.com/lindell/connect-iq-sdk-manager-cli/releases/download/v${VERSION}/connect-iq-sdk-manager-cli_${VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz -C /tmp connect-iq-sdk-manager
          sudo mv /tmp/connect-iq-sdk-manager /usr/local/bin/connect-iq-sdk-manager

      - name: Accept agreement
        run: |
          connect-iq-sdk-manager agreement accept \
            --agreement-hash "${{ secrets.GARMIN_AGREEMENT_HASH }}"

      - name: Login to Garmin
        run: |
          connect-iq-sdk-manager login \
            --username "${{ secrets.GARMIN_USERNAME }}" \
            --password "${{ secrets.GARMIN_PASSWORD }}"

      # ── SDK ───────────────────────────────────────────────────────────────
      - name: Cache SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ~/.Garmin/ConnectIQ/Sdks
          key: ciq-sdk-${{ runner.os }}-${{ hashFiles('manifest.xml') }}
          restore-keys: ciq-sdk-${{ runner.os }}-

      - name: Download latest SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          SDK_VERSION=$(curl -sf https://developer.garmin.com/downloads/connect-iq/sdks/sdks.json \
            | python3 -c "import sys,json; print(json.load(sys.stdin)[-1]['version'])")
          connect-iq-sdk-manager sdk set "$SDK_VERSION"

      - name: Add SDK to PATH
        run: |
          SDK_BIN=$(connect-iq-sdk-manager sdk current-path --bin)
          echo "$SDK_BIN" >> $GITHUB_PATH

      # ── Devices ───────────────────────────────────────────────────────────
      - name: Cache devices
        id: cache-devices
        uses: actions/cache@v4
        with:
          path: ~/.Garmin/ConnectIQ/Devices
          key: ciq-devices-${{ matrix.device }}-${{ hashFiles('manifest.xml') }}

      - name: Download device definitions
        if: steps.cache-devices.outputs.cache-hit != 'true'
        run: connect-iq-sdk-manager device download --manifest manifest.xml

      # ── Clé développeur ───────────────────────────────────────────────────
      - name: Setup developer key
        run: |
          if [ -n "${{ secrets.GARMIN_DEVELOPER_KEY }}" ]; then
            echo "${{ secrets.GARMIN_DEVELOPER_KEY }}" | base64 --decode > /tmp/developer_key.der
          else
            openssl genrsa -out /tmp/dev.pem 2048 2>/dev/null
            openssl pkcs8 -topk8 -inform PEM -outform DER \
              -in /tmp/dev.pem -out /tmp/developer_key.der -nocrypt
            echo "::warning::Clé temporaire — ajoutez GARMIN_DEVELOPER_KEY dans les secrets."
          fi

      # ── Compilation ───────────────────────────────────────────────────────
      - name: Build watch face
        run: |
          mkdir -p bin
          monkeyc \
            -o "bin/GarminSwatch-${{ matrix.device }}.prg" \
            -f monkey.jungle \
            -y /tmp/developer_key.der \
            -d ${{ matrix.device }} \
            --warn

      # ── Artifact ──────────────────────────────────────────────────────────
      - name: Upload PRG
        uses: actions/upload-artifact@v4
        with:
          name: GarminSwatch-${{ matrix.device }}-${{ github.sha }}
          path: bin/GarminSwatch-${{ matrix.device }}.prg
          retention-days: 30

  # ── Release automatique sur tag v* ────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: bin/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.prg
          generate_release_notes: true
